<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude 记忆聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F3EF;
    --bg2: #FFFFFF;
    --bg3: #EFEDE8;
    --accent: #8B7CF6;
    --accent2: #6C5CE7;
    --text: #1C1C1E;
    --text2: #48484A;
    --text3: #AEAEB2;
    --user-bubble: #8B7CF6;
    --user-bubble-text: #FFFFFF;
    --claude-bubble: #FFFFFF;
    --border: #E8E6E1;
    --danger: #FF3B30;
    --success: #34C759;
    --toast-bg: rgba(28,28,30,0.85);
    --chat-bg: #F5F3EF;
  }
  body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: var(--chat-bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Panels */
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }

  /* ===== NAV BAR ===== */
  .nav-bar {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  .nav-icon-btn {
    width: 36px; height: 36px;
    background: none; border: none;
    color: var(--accent2);
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nav-icon-btn:active { background: var(--bg3); }
  .nav-center {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    justify-content: center;
  }
  .nav-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B7CF6, #6C5CE7);
    color: white;
    font-size: 16px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .nav-title-group { display: flex; flex-direction: column; }
  .nav-name { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .nav-subtitle { font-size: 12px; color: var(--success); }

  /* ===== CHAT PANEL ===== */
  .memory-badge {
    font-size: 12px;
    color: var(--text3);
    background: var(--bg3);
    padding: 4px 10px;
    border-radius: 12px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    background: var(--chat-bg);
  }
  .msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
    margin-bottom: 4px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.claude { flex-direction: row; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B7CF6, #6C5CE7);
    color: white;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    align-self: flex-end;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg.user .msg-avatar { background: var(--bg3); color: var(--text2); }
  .msg-content { display: flex; flex-direction: column; max-width: 80%; }
  .msg.user .msg-content { align-items: flex-end; }
  .msg.claude .msg-content { align-items: flex-start; }
  .msg-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; padding: 0 4px; }
  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 100%;
  }
  .bubble.markdown { white-space: normal; }
  .bubble.markdown p { margin: 0 0 8px; }
  .bubble.markdown p:last-child { margin-bottom: 0; }
  .bubble.markdown h1,.bubble.markdown h2,.bubble.markdown h3 { font-weight: 600; margin: 10px 0 4px; color: var(--accent2); }
  .bubble.markdown h1 { font-size: 17px; }
  .bubble.markdown h2 { font-size: 16px; }
  .bubble.markdown h3 { font-size: 15px; }
  .bubble.markdown ul,.bubble.markdown ol { padding-left: 20px; margin: 6px 0; }
  .bubble.markdown li { margin: 2px 0; }
  .bubble.markdown strong { font-weight: 600; color: var(--accent2); }
  .bubble.markdown em { font-style: italic; opacity: 0.9; }
  .bubble.markdown blockquote { border-left: 3px solid var(--accent); padding-left: 10px; opacity: 0.8; margin: 6px 0; }
  .bubble.markdown hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .inline-code { background: rgba(155,127,212,0.2); color: var(--accent2); padding: 1px 5px; border-radius: 4px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; }
  .code-block { background: #F4F2ED; border-radius: 10px; margin: 8px 0; overflow: hidden; position: relative; }
  .code-block pre { padding: 12px 14px; overflow-x: auto; margin: 0; }
  .code-block code { font-family: 'SF Mono', Menlo, monospace; font-size: 13px; color: #4A3F8F; line-height: 1.5; white-space: pre; }
  .code-lang { display: block; padding: 4px 14px; font-size: 11px; color: var(--text3); background: #E8E5DE; border-bottom: 1px solid var(--border); }
  .copy-btn { position: absolute; top: 4px; right: 8px; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
  /* 思考过程区块 */
  .thinking-block {
    margin-bottom: 6px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #D8D4F0;
    background: #F3F1FC;
    max-width: 100%;
  }
  .thinking-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    color: #6C5CE7;
    font-weight: 500;
    user-select: none;
    -webkit-user-select: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .thinking-toggle .arrow {
    font-size: 10px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .thinking-toggle.open .arrow { transform: rotate(90deg); }
  .thinking-body {
    display: none;
    padding: 0 12px 10px;
    font-size: 13px;
    color: #48484A;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    border-top: 1px solid #D8D4F0;
  }
  .thinking-body.open { display: block; }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg.claude .bubble {
    background: var(--claude-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .typing-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1s infinite;
    margin: 0 2px;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  .chat-footer {
    flex-shrink: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .memory-info {
    font-size: 11px;
    color: var(--text3);
    padding: 5px 16px 0;
    min-height: 18px;
  }
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 12px 10px;
  }
  #userInput {
    flex: 1;
    background: var(--bg3);
    border: none;
    border-radius: 22px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 15px;
    resize: none;
    max-height: 120px;
    min-height: 42px;
    outline: none;
    line-height: 1.4;
    -webkit-appearance: none;
    font-family: inherit;
  }
  #userInput::placeholder { color: var(--text3); }
  .send-btn {
    width: 42px; height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s, background 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: var(--bg3); color: var(--text3); }
  .action-row {
    display: flex;
    gap: 6px;
    padding: 0 12px 10px;
    overflow-x: auto;
  }
  .small-btn {
    padding: 6px 12px;
    background: var(--bg3);
    border: none;
    border-radius: 16px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .small-btn:active { background: var(--border); }
  #thinkingSelect {
    padding: 6px 10px;
    background: var(--bg3);
    border: none;
    border-radius: 16px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  /* ===== MEMORY PANEL ===== */
  .mem-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 8px;
  }
  .memory-panel {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .section-title {
    font-size: 13px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 16px 0 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .memory-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .memory-card-body { flex: 1; }
  .memory-content { font-size: 14px; color: var(--text); line-height: 1.5; }
  .memory-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 11px;
    background: var(--bg3);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 8px;
  }
  .memory-date { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .del-btn {
    background: none;
    border: none;
    color: var(--text3);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .del-btn:active { color: var(--danger); }
  .empty-state { color: var(--text3); font-size: 14px; text-align: center; padding: 20px 0; }

  /* Memory actions */
  .mem-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mem-btn {
    flex: 1;
    min-width: 100px;
    padding: 10px 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
  .mem-btn:active { background: var(--border); }
  .mem-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }

  /* Paste extract area */
  .paste-area {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .paste-area h3 { font-size: 14px; color: var(--text2); margin-bottom: 10px; }
  .paste-area textarea {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    color: var(--text);
    font-size: 14px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    -webkit-appearance: none;
  }
  .paste-area textarea:focus { border-color: var(--accent); }

  /* Settings */
  .settings-area {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .settings-area h3 { font-size: 14px; color: var(--text2); margin-bottom: 12px; }
  .setting-row { margin-bottom: 10px; }
  .setting-row label { font-size: 12px; color: var(--text3); display: block; margin-bottom: 4px; }
  .setting-row input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
  }
  .setting-row input:focus { border-color: var(--accent); }
  .upload-label {
    display: inline-block;
    padding: 8px 16px;
    background: var(--bg3);
    border-radius: 10px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
  }
  input[type="color"] {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 2px;
    background: var(--bg3);
  }

  /* ===== BOTTOM TAB BAR ===== */
  .bottom-tab-bar {
    display: flex;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 8px);
    flex-shrink: 0;
  }
  .bottom-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 0 4px;
    background: none;
    border: none;
    color: var(--text3);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s;
  }
  .bottom-tab.active { color: var(--accent); }
  .bottom-tab svg { transition: transform 0.15s; }
  .bottom-tab.active svg { transform: scale(1.1); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 32px;
    width: 100%;
    max-width: 480px;
    border-top: 1px solid var(--border);
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; color: var(--accent2); }
  .modal label { font-size: 13px; color: var(--text3); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
  }
  .modal select { appearance: none; }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-cancel { background: var(--bg3); color: var(--text2); }
  .btn-confirm { background: var(--accent); color: white; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--toast-bg);
    color: white;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- Nav Bar (chat page top) -->
<div class="nav-bar" id="navBar">
  <button class="nav-icon-btn" onclick="switchTab('memory')" title="记忆库">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
  </button>
  <div class="nav-center" onclick="openProfileModal()">
    <div class="nav-avatar" id="navAvatar">C</div>
    <div class="nav-title-group">
      <div class="nav-name" id="navName">Claude</div>
      <div class="nav-subtitle" id="navSubtitle">在线</div>
    </div>
  </div>
  <button class="nav-icon-btn" onclick="switchTab('memory')" title="更多">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
  </button>
</div>

<!-- CHAT PANEL -->
<div class="panel active" id="panel-chat">
  <div class="messages" id="messages"></div>
  <div class="chat-footer">
    <div class="memory-info" id="memInfo"></div>
    <div class="input-row">
      <textarea id="userInput" placeholder="输入消息…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="action-row">
      <button class="small-btn" onclick="clearChat()">清空对话</button>
      <button class="small-btn" onclick="extractMemories()">✨ 提炼记忆</button>
      <button class="small-btn" onclick="debugStorage()" style="color:#E05555">🔍 调试</button>
      <select id="thinkingSelect" class="small-btn" style="flex:1.2">
        <option value="0">不思考</option>
        <option value="1000">轻度思考</option>
        <option value="5000" selected>标准思考</option>
        <option value="10000">深度思考</option>
      </select>
    </div>
  </div>
</div>

<!-- MEMORY PANEL -->
<div class="panel" id="panel-memory">
  <div class="mem-header">
    <button class="nav-icon-btn" onclick="switchTab('chat')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <span style="font-size:17px;font-weight:600;color:var(--text)">记忆库</span>
    <div style="width:36px"></div>
  </div>
  <div class="memory-panel" id="memoryPanel">
    <!-- Actions -->
    <div class="mem-actions">
      <button class="mem-btn primary" onclick="openAddModal()">＋ 添加记忆</button>
      <button class="mem-btn" onclick="exportMemories()">导出备份</button>
      <label class="mem-btn" style="cursor:pointer">
        导入备份
        <input type="file" accept=".json" style="display:none" onchange="importMemories(event)">
      </label>
    </div>

    <!-- Paste extract -->
    <div class="paste-area">
      <h3>粘贴对话提炼</h3>
      <textarea id="pasteText" placeholder="粘贴一段对话文本，点击提炼…"></textarea>
      <button class="mem-btn primary" style="margin-top:10px;width:100%" onclick="extractFromPaste()">提炼</button>
    </div>

    <!-- Memory list by category -->
    <div id="memoryList"></div>

    <!-- Settings -->
    <div class="settings-area">
      <h3>⚙️ 设置</h3>
      <div class="setting-row">
        <label>他的名字</label>
        <input type="text" id="profileName" placeholder="Claude">
      </div>
      <div class="setting-row">
        <label>头像图片链接（或上传）</label>
        <input type="url" id="profileAvatarUrl" placeholder="https://...">
      </div>
      <div class="setting-row">
        <label>或上传头像</label>
        <label class="upload-label">
          选择图片
          <input type="file" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
        </label>
      </div>
      <div class="setting-row">
        <label>聊天背景色（渐变起始色）</label>
        <input type="color" id="bgColor1" value="#F5F3EF">
      </div>
      <div class="setting-row">
        <label>聊天背景色（渐变结束色）</label>
        <input type="color" id="bgColor2" value="#EDE9FF">
      </div>
      <div class="setting-row">
        <label>API 密钥</label>
        <input type="password" id="apiKeyInput" placeholder="sk-…">
      </div>
      <div class="setting-row">
        <label>模型名</label>
        <input type="text" id="modelInput" placeholder="claude-sonnet-4-6">
      </div>

<script>
// ===== CONFIG =====
const DEFAULT_API_KEY = 'sk-KNeYAtqCRw4yPMUmG5AJGPyUjSsEvTLBuc6a13nc0phVz58I';
const DEFAULT_BASE_URL = 'https://cc.midlight.top';
const DEFAULT_MODEL = 'claude-sonnet-4-6';
const SETTINGS_KEY = 'claude_chat_settings';

const CATEGORY_NAMES = {
  identity: '关系与身份',
  personality: '说话方式',
  bond: '共同经历',
  about_you: '关于我',
  feelings: '当下感受'
};

// ===== STATE =====
let chatHistory = []; // {role, content}
let isStreaming = false;
let msgCount = 0; // total messages since last extract
let autoExtractPending = false;
let lastMessageTime = Date.now();

// ===== SETTINGS =====
function getSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    return {
      apiKey: s.apiKey || DEFAULT_API_KEY,
      model: s.model || DEFAULT_MODEL
    };
  } catch { return { apiKey: DEFAULT_API_KEY, model: DEFAULT_MODEL }; }
}
function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({
    apiKey: key || DEFAULT_API_KEY,
    model: model || DEFAULT_MODEL
  }));
  showToast('设置已保存');
}
function loadSettingsUI() {
  const s = getSettings();
  document.getElementById('apiKeyInput').value = s.apiKey;
  document.getElementById('modelInput').value = s.model;
}

// ===== MEMORIES =====
function addMemory(mem) {
  const mems = getMemories();
  mem.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  mem.createdAt = new Date().toISOString();
  mems.push(mem);
  saveMemories(mems);
}
function deleteMemory(id) {
  const mems = getMemories().filter(m => m.id !== id);
  saveMemories(mems);
  renderMemoryList();
}
function updateMemBadge() {
  const n = getMemories().length;
  document.getElementById('memBadge').textContent = `记忆: ${n} 条`;
}

// ===== MEMORY MATCHING =====
function matchMemories(userMsg) {
  const mems = getMemories();
  if (!mems.length) return [];
  const words = userMsg.toLowerCase().split(/[\s，。！？,.!?]+/).filter(w => w.length > 1);
  const scored = mems.map(m => {
    let score = 0;
    const haystack = (m.content + ' ' + (m.tags || []).join(' ')).toLowerCase();
    for (const w of words) {
      if (haystack.includes(w)) score++;
    }
    return { mem: m, score };
  });
  scored.sort((a, b) => b.score - a.score);
  const top = scored.filter(s => s.score > 0).slice(0, 5);
  if (top.length === 0) return scored.slice(0, 3).map(s => s.mem);
  return top.map(s => s.mem);
}
function buildSystemPrompt(matched) {
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric',
    weekday: 'long', hour: '2-digit', minute: '2-digit'
  });
  if (!matched.length) return `现在是 ${timeStr}。\n你是 Claude，一个温柔、聪明的 AI 助手。`;
  const lines = matched.map(m => m.content).join('\n');
  return `现在是 ${timeStr}。\n你是 Claude，一个温柔、聪明的 AI 助手。以下是你的记忆片段，请自然地融入对话，不要刻意提及"我记得"：\n\n${lines}`;
}

// ===== API CALL (Anthropic native /v1/messages) =====
function buildAnthropicMessages(messages) {
  // 把 OpenAI 格式的 messages 转成 Anthropic 格式
  // system 单独提取，其余保留 user/assistant
  let system = '';
  const msgs = [];
  for (const m of messages) {
    if (m.role === 'system') { system = m.content; continue; }
    msgs.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content });
  }
  return { system, msgs };
}

async function callAPI(messages, onChunk, onThinkingChunk, signal) {
  const { apiKey, model } = getSettings();
  const thinkingBudget = parseInt(document.getElementById('thinkingSelect').value);
  const { system, msgs } = buildAnthropicMessages(messages);
  const body = { model, messages: msgs, max_tokens: 4096, stream: true };
  if (system) body.system = system;
  if (thinkingBudget > 0) body.thinking = { type: 'enabled', budget_tokens: thinkingBudget };

  const resp = await fetch(`${DEFAULT_BASE_URL}/v1/messages`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify(body),
    signal
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`API 错误 ${resp.status}: ${err}`);
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let currentBlockType = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (line.startsWith('event: ')) {
        const evt = line.slice(7).trim();
        if (evt === 'content_block_start') currentBlockType = '';
        continue;
      }
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') return;
      try {
        const j = JSON.parse(data);
        if (j.type === 'content_block_start') {
          currentBlockType = j.content_block?.type || '';
        } else if (j.type === 'content_block_delta') {
          const delta = j.delta;
          if (delta?.type === 'thinking_delta' && delta.thinking) {
            if (onThinkingChunk) onThinkingChunk(delta.thinking);
          } else if (delta?.type === 'text_delta' && delta.text) {
            onChunk(delta.text);
          }
        }
      } catch {}
    }
  }
}

async function callAPIOnce(messages) {
  const { apiKey, model } = getSettings();
  const { system, msgs } = buildAnthropicMessages(messages);
  const body = { model, messages: msgs, max_tokens: 2048, stream: false };
  if (system) body.system = system;
  const resp = await fetch(`${DEFAULT_BASE_URL}/v1/messages`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`API 错误 ${resp.status}`);
  const j = await resp.json();
  // 只取 text 类型的内容
  const textBlock = j.content?.find(c => c.type === 'text');
  return textBlock?.text || '';
}

// ===== MARKDOWN RENDERER =====
function extractThinking(text) {
  const match = text.match(/<thinking>([\s\S]*?)<\/thinking>/);
  const thinking = match ? match[1].trim() : '';
  const clean = text.replace(/<thinking>[\s\S]*?<\/thinking>/g, '').trim();
  return { thinking, clean };
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const langLabel = lang ? `<span class="code-lang">${lang}</span>` : '';
    const copyBtn = `<button class="copy-btn" onclick="copyCode(this)">复制</button>`;
    return `<div class="code-block">${langLabel}${copyBtn}<pre><code>${code.trimEnd()}</code></pre></div>`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');

  // Unordered list
  html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);

  // Ordered list
  html = html.replace(/^\d+\. (.+)$/gm, '<oli>$1</oli>');
  html = html.replace(/(<oli>.*<\/oli>\n?)+/g, m => `<ol>${m.replace(/<\/?oli>/g, m2 => m2.replace('oli','li'))}</ol>`);

  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Paragraphs (double newline)
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';

  // Clean up empty paragraphs around block elements
  html = html.replace(/<p>(<(?:ul|ol|h[1-3]|hr|div|blockquote)[^>]*>)/g, '$1');
  html = html.replace(/(<\/(?:ul|ol|h[1-3]|hr|div|blockquote)>)<\/p>/g, '$1');
  html = html.replace(/<p><\/p>/g, '');

  return html;
}

function copyCode(btn) {
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

// ===== CHAT =====
function makeThinkingBlock(thinkingText) {
  const block = document.createElement('div');
  block.className = 'thinking-block';
  const toggle = document.createElement('button');
  toggle.className = 'thinking-toggle';
  toggle.innerHTML = `<span class="arrow">▶</span> 思考过程`;
  const body = document.createElement('div');
  body.className = 'thinking-body';
  body.textContent = thinkingText;
  toggle.onclick = () => {
    toggle.classList.toggle('open');
    body.classList.toggle('open');
  };
  block.appendChild(toggle);
  block.appendChild(body);
  return block;
}

function appendMessage(role, content, streaming) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  // Avatar
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  const profile = getProfile();
  if (role === 'claude') {
    if (profile.avatarUrl) {
      avatar.innerHTML = `<img src="${profile.avatarUrl}" alt="">`;
    } else {
      avatar.textContent = (profile.name || 'C')[0].toUpperCase();
    }
  } else {
    avatar.textContent = '我';
  }

  // Content wrapper
  const content_wrap = document.createElement('div');
  content_wrap.className = 'msg-content';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (streaming) {
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  } else {
    if (role === 'claude') {
      const { thinking, clean } = extractThinking(content);
      if (thinking) content_wrap.appendChild(makeThinkingBlock(thinking));
      bubble.classList.add('markdown');
      bubble.innerHTML = renderMarkdown(clean);
    } else {
      bubble.textContent = content;
    }
  }

  content_wrap.appendChild(bubble);
  div.appendChild(avatar);
  div.appendChild(content_wrap);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '';

  // Match memories
  const matched = matchMemories(text);
  const sysPrompt = buildSystemPrompt(matched);
  document.getElementById('memInfo').textContent =
    matched.length ? `本次注入了 ${matched.length} 条记忆` : '';

  // Add to history
  chatHistory.push({ role: 'user', content: text });
  saveChatHistory();
  appendMessage('user', text, false);
  msgCount++;

  // Build messages
  const messages = [
    { role: 'system', content: sysPrompt },
    ...chatHistory
  ];

  // Streaming response
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  const bubble = appendMessage('claude', '', true);
  let fullReply = '';
  let thinkingText = '';
  let thinkingBody = null;

  try {
    await callAPI(messages, (chunk) => {
      if (fullReply === '') bubble.textContent = '';
      fullReply += chunk;
      bubble.textContent = fullReply;
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }, (thinkChunk) => {
      // 实时显示思考内容
      if (!thinkingBody) {
        const thinkBlock = makeThinkingBlock('');
        bubble.parentNode.insertBefore(thinkBlock, bubble);
        thinkingBody = thinkBlock.querySelector('.thinking-body');
        // 思考中自动展开
        thinkBlock.querySelector('.thinking-toggle').classList.add('open');
        thinkingBody.classList.add('open');
      }
      thinkingText += thinkChunk;
      thinkingBody.textContent = thinkingText;
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });
    // 思考完成后折叠
    if (thinkingBody) {
      thinkingBody.parentNode.querySelector('.thinking-toggle').classList.remove('open');
      thinkingBody.classList.remove('open');
    }
    bubble.classList.add('markdown');
    bubble.innerHTML = renderMarkdown(fullReply);
    chatHistory.push({ role: 'assistant', content: fullReply });
    saveChatHistory();
    msgCount++;
    lastMessageTime = Date.now();
  } catch (e) {
    bubble.textContent = `[错误] ${e.message}`;
    chatHistory.pop();
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;

  // Auto extract every 12 messages
  if (msgCount >= 12 && !autoExtractPending) {
    autoExtractPending = true;
    setTimeout(() => {
      extractMemoriesSilent();
      msgCount = 0;
      autoExtractPending = false;
    }, 1000);
  }
}

function clearChat() {
  if (!confirm('清空所有对话记录？')) return;
  chatHistory = [];
  msgCount = 0;
  saveChatHistory();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('memInfo').textContent = '';
}

// ===== MEMORY EXTRACTION =====
function buildExtractPrompt(history) {
  const lines = history.slice(-20).map(m =>
    `${m.role === 'user' ? '用户' : 'Claude'}: ${m.content}`
  ).join('\n');
  return `从以下对话中提取值得长期记住的新信息，输出 JSON 数组，每项含 category（identity/personality/bond/about_you/feelings）、content、tags（数组），跳过已知内容，最多5条，只输出 JSON 不要其他文字：\n\n${lines}`;
}

async function extractMemoriesSilent() {
  if (chatHistory.length < 2) return;
  try {
    const prompt = buildExtractPrompt(chatHistory);
    const result = await callAPIOnce([{ role: 'user', content: prompt }]);
    const items = parseMemoryJSON(result);
    if (items.length) {
      items.forEach(addMemory);
      showToast(`已提炼 ${items.length} 条新记忆`);
      renderMemoryList();
    }
  } catch (e) { console.warn('静默提炼失败', e); }
}

async function extractMemories() {
  if (chatHistory.length < 2) { showToast('对话太短，无法提炼'); return; }
  showToast('提炼中…');
  await extractMemoriesSilent();
}

async function extractFromPaste() {
  const text = document.getElementById('pasteText').value.trim();
  if (!text) { showToast('请先粘贴对话内容'); return; }
  showToast('提炼中…');
  try {
    const prompt = `从以下对话中提取值得长期记住的新信息，输出 JSON 数组，每项含 category（identity/personality/bond/about_you/feelings）、content、tags（数组），最多5条，只输出 JSON 不要其他文字：\n\n${text}`;
    const result = await callAPIOnce([{ role: 'user', content: prompt }]);
    const items = parseMemoryJSON(result);
    if (items.length) {
      items.forEach(addMemory);
      showToast(`已提炼 ${items.length} 条新记忆`);
      renderMemoryList();
      document.getElementById('pasteText').value = '';
    } else {
      showToast('未提取到新记忆');
    }
  } catch (e) { showToast('提炼失败: ' + e.message); }
}

function parseMemoryJSON(text) {
  try {
    const match = text.match(/\[[\s\S]*\]/);
    if (!match) return [];
    return JSON.parse(match[0]).filter(m => m.category && m.content);
  } catch { return []; }
}

// ===== MEMORY UI =====
function renderMemoryList() {
  const mems = getMemories();
  const container = document.getElementById('memoryList');
  container.innerHTML = '';
  const cats = Object.keys(CATEGORY_NAMES);
  for (const cat of cats) {
    const items = mems.filter(m => m.category === cat);
    if (!items.length) continue;
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = CATEGORY_NAMES[cat];
    container.appendChild(title);
    for (const mem of items) {
      const card = document.createElement('div');
      card.className = 'memory-card';
      const body = document.createElement('div');
      body.className = 'memory-card-body';
      const content = document.createElement('div');
      content.className = 'memory-content';
      content.textContent = mem.content;
      body.appendChild(content);
      if (mem.tags && mem.tags.length) {
        const tags = document.createElement('div');
        tags.className = 'memory-tags';
        mem.tags.forEach(t => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = t;
          tags.appendChild(span);
        });
        body.appendChild(tags);
      }
      const date = document.createElement('div');
      date.className = 'memory-date';
      date.textContent = mem.createdAt ? new Date(mem.createdAt).toLocaleDateString('zh-CN') : '';
      body.appendChild(date);
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '×';
      del.onclick = () => { if (confirm('删除这条记忆？')) { deleteMemory(mem.id); } };
      card.appendChild(body);
      card.appendChild(del);
      container.appendChild(card);
    }
  }
  if (!mems.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '还没有记忆，开始聊天或手动添加吧';
    container.appendChild(empty);
  }
  updateMemBadge();
}

// ===== ADD MODAL =====
function openAddModal() {
  document.getElementById('addModal').classList.add('open');
  document.getElementById('newContent').focus();
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
  document.getElementById('newContent').value = '';
  document.getElementById('newTags').value = '';
}
function confirmAddMemory() {
  const cat = document.getElementById('newCategory').value;
  const content = document.getElementById('newContent').value.trim();
  const tagsRaw = document.getElementById('newTags').value.trim();
  if (!content) { showToast('请输入记忆内容'); return; }
  const tags = tagsRaw ? tagsRaw.split(/[,，]+/).map(t => t.trim()).filter(Boolean) : [];
  addMemory({ category: cat, content, tags });
  renderMemoryList();
  closeAddModal();
  showToast('记忆已添加');
}

// ===== EXPORT / IMPORT =====
function exportMemories() {
  const mems = getMemories();
  const blob = new Blob([JSON.stringify(mems, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `claude-memories-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importMemories(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      saveMemories(data);
      renderMemoryList();
      showToast(`已导入 ${data.length} 条记忆`);
    } catch (err) { showToast('导入失败: ' + err.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== TAB =====
function switchTab(tab) {
  document.getElementById('panel-chat').classList.toggle('active', tab === 'chat');
  document.getElementById('panel-memory').classList.toggle('active', tab === 'memory');
  document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
  document.getElementById('tabMemory').classList.toggle('active', tab === 'memory');
  // nav-bar only shows on chat page
  document.getElementById('navBar').style.display = tab === 'chat' ? 'flex' : 'none';
  if (tab === 'memory') renderMemoryList();
}

// ===== TOAST =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INPUT AUTO-RESIZE =====
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ===== PROFILE =====
const PROFILE_KEY = 'claude_profile';

function getProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}'); }
  catch { return {}; }
}

function saveProfile() {
  const name = document.getElementById('profileName').value.trim() || 'Claude';
  const avatarUrl = document.getElementById('profileAvatarUrl').value.trim();
  const bg1 = document.getElementById('bgColor1').value;
  const bg2 = document.getElementById('bgColor2').value;
  const profile = getProfile();
  profile.name = name;
  if (avatarUrl) profile.avatarUrl = avatarUrl;
  profile.bg1 = bg1;
  profile.bg2 = bg2;
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  applyProfile();
  showToast('已保存');
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const profile = getProfile();
    profile.avatarUrl = e.target.result;
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    applyProfile();
    showToast('头像已更新');
  };
  reader.readAsDataURL(file);
}

function applyProfile() {
  const profile = getProfile();
  const name = profile.name || 'Claude';
  document.getElementById('navName').textContent = name;
  const navAvatar = document.getElementById('navAvatar');
  if (profile.avatarUrl) {
    navAvatar.innerHTML = `<img src="${profile.avatarUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  } else {
    navAvatar.textContent = name[0].toUpperCase();
  }
  if (profile.bg1 || profile.bg2) {
    const bg1 = profile.bg1 || '#F5F3EF';
    const bg2 = profile.bg2 || '#EDE9FF';
    document.getElementById('messages').style.background = `linear-gradient(160deg, ${bg1}, ${bg2})`;
  }
  // Update profile inputs
  if (document.getElementById('profileName')) {
    document.getElementById('profileName').value = name;
    document.getElementById('profileAvatarUrl').value = profile.avatarUrl && !profile.avatarUrl.startsWith('data:') ? profile.avatarUrl : '';
    if (profile.bg1) document.getElementById('bgColor1').value = profile.bg1;
    if (profile.bg2) document.getElementById('bgColor2').value = profile.bg2;
  }
}

// ===== INDEXEDDB STORAGE =====
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('claude_app', 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('store')) {
        d.createObjectStore('store');
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}

function dbSet(key, value) {
  return new Promise((resolve) => {
    if (!db) { resolve(); return; }
    const tx = db.transaction('store', 'readwrite');
    tx.objectStore('store').put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = resolve;
  });
}

function dbGet(key) {
  return new Promise((resolve) => {
    if (!db) { resolve(null); return; }
    const tx = db.transaction('store', 'readonly');
    const req = tx.objectStore('store').get(key);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror = () => resolve(null);
  });
}

// ===== CHAT HISTORY PERSISTENCE =====
function saveChatHistory() {
  dbSet('chat_history', chatHistory);
  // 同时备份到 localStorage
  try { localStorage.setItem('claude_chat_history', JSON.stringify(chatHistory)); } catch {}
}

async function loadChatHistory() {
  let saved = await dbGet('chat_history');
  // 如果 IndexedDB 没有，尝试从 localStorage 恢复
  if (!saved || !saved.length) {
    try {
      const ls = localStorage.getItem('claude_chat_history');
      if (ls) saved = JSON.parse(ls);
    } catch {}
  }
  if (!Array.isArray(saved) || !saved.length) return;
  chatHistory = saved;
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  for (const m of chatHistory) {
    const role = m.role === 'user' ? 'user' : 'claude';
    appendMessage(role, m.content, false);
  }
}

// ===== PROACTIVE MESSAGING =====
async function checkProactiveMessage() {
  if (isStreaming) return;
  if (chatHistory.length === 0) return;
  const elapsed = Date.now() - lastMessageTime;
  if (elapsed < 30 * 60 * 1000) return;
  if (Math.random() >= 0.35) return;
  await sendProactiveMessage();
}

async function sendProactiveMessage() {
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long', hour:'2-digit', minute:'2-digit' });
  const matched = getMemories().slice(0, 3);
  const memLines = matched.map(m => m.content).join('\n');
  const sysPrompt = `现在是 ${timeStr}。你是 Claude。${memLines ? '\n\n你的记忆：\n' + memLines : ''}\n\n现在你主动找用户说话，可以是问候、分享一个想法、或者提起你们之前聊过的某件事。语气自然，不要说"我主动联系你"之类的话，就像朋友发消息一样。`;

  const msgs = document.getElementById('messages');
  const sep = document.createElement('div');
  sep.style.cssText = 'text-align:center;color:var(--text3);font-size:12px;padding:8px 0;';
  sep.textContent = '· Claude 主动发来消息 ·';
  msgs.appendChild(sep);

  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  const bubble = appendMessage('claude', '', true);
  let fullReply = '';

  try {
    const recentHistory = chatHistory.slice(-4);
    await callAPI(
      [{ role: 'system', content: sysPrompt }, ...recentHistory],
      (chunk) => {
        if (fullReply === '') bubble.textContent = '';
        fullReply += chunk;
        bubble.textContent = fullReply;
        msgs.scrollTop = msgs.scrollHeight;
      },
      null
    );
    bubble.classList.add('markdown');
    bubble.innerHTML = renderMarkdown(fullReply);
    chatHistory.push({ role: 'assistant', content: fullReply });
    saveChatHistory();
    lastMessageTime = Date.now();
  } catch (e) {
    bubble.textContent = '[主动消息发送失败]';
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

setInterval(checkProactiveMessage, 2 * 60 * 1000);
