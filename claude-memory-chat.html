<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude 记忆聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F3EF;
    --bg2: #FFFFFF;
    --bg3: #EFEDE8;
    --accent: #8B7CF6;
    --accent2: #6C5CE7;
    --text: #1C1C1E;
    --text2: #48484A;
    --text3: #AEAEB2;
    --user-bubble: #8B7CF6;
    --user-bubble-text: #FFFFFF;
    --claude-bubble: #FFFFFF;
    --border: #E8E6E1;
    --danger: #FF3B30;
    --success: #34C759;
    --toast-bg: rgba(28,28,30,0.85);
    --chat-bg: #F5F3EF;
  }
  body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: var(--chat-bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== NAV BAR ===== */
  .nav-bar {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  .nav-icon-btn {
    width: 36px; height: 36px;
    background: none; border: none;
    color: var(--accent2);
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
  }
  .nav-icon-btn:active { background: var(--bg3); }
  .nav-center {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .nav-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B7CF6, #6C5CE7);
    color: white;
    font-size: 16px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .nav-title-group { display: flex; flex-direction: column; }
  .nav-name { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .nav-subtitle { font-size: 12px; color: var(--success); }

  /* ===== MESSAGES ===== */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    background: var(--chat-bg);
  }
  .msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
    margin-bottom: 4px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.claude { flex-direction: row; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B7CF6, #6C5CE7);
    color: white;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    align-self: flex-end;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg.user .msg-avatar { background: var(--bg3); color: var(--text2); }
  .msg-content { display: flex; flex-direction: column; max-width: 80%; }
  .msg.user .msg-content { align-items: flex-end; }
  .msg.claude .msg-content { align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    max-width: 100%;
  }
  .bubble.markdown { white-space: normal; }
  .bubble.markdown p { margin: 0 0 8px; }
  .bubble.markdown p:last-child { margin-bottom: 0; }
  .bubble.markdown h1,.bubble.markdown h2,.bubble.markdown h3 { font-weight: 600; margin: 10px 0 4px; color: var(--accent2); }
  .bubble.markdown h1 { font-size: 17px; }
  .bubble.markdown h2 { font-size: 16px; }
  .bubble.markdown h3 { font-size: 15px; }
  .bubble.markdown ul,.bubble.markdown ol { padding-left: 20px; margin: 6px 0; }
  .bubble.markdown li { margin: 2px 0; }
  .bubble.markdown strong { font-weight: 600; color: var(--accent2); }
  .bubble.markdown em { font-style: italic; opacity: 0.9; }
  .bubble.markdown blockquote { border-left: 3px solid var(--accent); padding-left: 10px; opacity: 0.8; margin: 6px 0; }
  .bubble.markdown hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .inline-code { background: rgba(155,127,212,0.2); color: var(--accent2); padding: 1px 5px; border-radius: 4px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; }
  .code-block { background: #F4F2ED; border-radius: 10px; margin: 8px 0; overflow: hidden; position: relative; }
  .code-block pre { padding: 12px 14px; overflow-x: auto; margin: 0; }
  .code-block code { font-family: 'SF Mono', Menlo, monospace; font-size: 13px; color: #4A3F8F; line-height: 1.5; white-space: pre; }
  .code-lang { display: block; padding: 4px 14px; font-size: 11px; color: var(--text3); background: #E8E5DE; border-bottom: 1px solid var(--border); }
  .copy-btn { position: absolute; top: 4px; right: 8px; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 4px;
  }
  .msg.claude .bubble {
    background: var(--claude-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .typing-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1s infinite;
    margin: 0 2px;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* ===== FOOTER ===== */
  .chat-footer {
    flex-shrink: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px 10px;
  }
  #userInput {
    flex: 1;
    background: var(--bg3);
    border: none;
    border-radius: 22px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 15px;
    resize: none;
    max-height: 120px;
    min-height: 42px;
    outline: none;
    line-height: 1.4;
    -webkit-appearance: none;
    font-family: inherit;
  }
  #userInput::placeholder { color: var(--text3); }
  .send-btn {
    width: 42px; height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s, background 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: var(--bg3); color: var(--text3); }
  .action-row {
    display: flex;
    gap: 6px;
    padding: 0 12px 10px;
  }
  .small-btn {
    padding: 6px 12px;
    background: var(--bg3);
    border: none;
    border-radius: 16px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  .small-btn:active { background: var(--border); }

  /* ===== SETTINGS MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 32px;
    width: 100%;
    max-width: 480px;
    border-top: 1px solid var(--border);
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; color: var(--accent2); }
  .modal label { font-size: 13px; color: var(--text3); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-cancel { background: var(--bg3); color: var(--text2); }
  .btn-confirm { background: var(--accent); color: white; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--toast-bg);
    color: white;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
    backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="nav-bar">
  <div style="width:36px"></div>
  <div class="nav-center">
    <div class="nav-avatar" id="navAvatar">C</div>
    <div class="nav-title-group">
      <div class="nav-name" id="navName">Claude</div>
      <div class="nav-subtitle">在线</div>
    </div>
  </div>
  <button class="nav-icon-btn" onclick="openSettings()" title="设置">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div class="messages" id="messages"></div>

<div class="chat-footer">
  <div class="input-row">
    <textarea id="userInput" placeholder="输入消息…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="action-row">
    <button class="small-btn" onclick="clearChat()">清空对话</button>
    <a class="small-btn" href="https://ai-memory-gateway-6lol.onrender.com/dashboard" target="_blank" style="text-decoration:none">记忆管理</a>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>设置</h2>
    <label>Gateway 地址</label>
    <input type="url" id="gatewayUrl" placeholder="https://ai-memory-gateway-6lol.onrender.com">
    <label>API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-…">
    <label>模型名</label>
    <input type="text" id="modelInput" placeholder="claude-sonnet-4-5">
    <label>他的名字</label>
    <input type="text" id="profileName" placeholder="Claude">
    <label>头像图片链接</label>
    <input type="url" id="profileAvatarUrl" placeholder="https://...">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn-confirm" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SETTINGS_KEY = 'claude_chat_settings_v2';

function getSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    return {
      gatewayUrl: s.gatewayUrl || 'https://ai-memory-gateway-6lol.onrender.com',
      apiKey: s.apiKey || '',
      model: s.model || 'claude-sonnet-4-5',
      name: s.name || 'Claude',
      avatarUrl: s.avatarUrl || ''
    };
  } catch { return { gatewayUrl: 'https://ai-memory-gateway-6lol.onrender.com', apiKey: '', model: 'claude-sonnet-4-5', name: 'Claude', avatarUrl: '' }; }
}

function saveSettings() {
  const s = {
    gatewayUrl: document.getElementById('gatewayUrl').value.trim() || 'https://ai-memory-gateway-6lol.onrender.com',
    apiKey: document.getElementById('apiKeyInput').value.trim(),
    model: document.getElementById('modelInput').value.trim() || 'claude-sonnet-4-5',
    name: document.getElementById('profileName').value.trim() || 'Claude',
    avatarUrl: document.getElementById('profileAvatarUrl').value.trim()
  };
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  applyProfile();
  closeSettings();
  showToast('设置已保存');
}

function openSettings() {
  const s = getSettings();
  document.getElementById('gatewayUrl').value = s.gatewayUrl;
  document.getElementById('apiKeyInput').value = s.apiKey;
  document.getElementById('modelInput').value = s.model;
  document.getElementById('profileName').value = s.name;
  document.getElementById('profileAvatarUrl').value = s.avatarUrl;
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

function applyProfile() {
  const s = getSettings();
  document.getElementById('navName').textContent = s.name;
  const navAvatar = document.getElementById('navAvatar');
  if (s.avatarUrl) {
    navAvatar.innerHTML = `<img src="${s.avatarUrl}" alt="">`;
  } else {
    navAvatar.textContent = s.name[0].toUpperCase();
  }
}

// ===== CHAT STATE =====
let chatHistory = [];
let isStreaming = false;

// ===== API =====
async function callGateway(onChunk, signal) {
  const s = getSettings();
  const body = {
    model: s.model,
    messages: chatHistory,
    stream: true
  };
  const resp = await fetch(`${s.gatewayUrl}/v1/chat/completions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${s.apiKey}`
    },
    body: JSON.stringify(body),
    signal
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`错误 ${resp.status}: ${err}`);
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') return;
      try {
        const j = JSON.parse(data);
        const text = j.choices?.[0]?.delta?.content;
        if (text) onChunk(text);
      } catch {}
    }
  }
}

// ===== MARKDOWN =====
function renderMarkdown(text) {
  if (!text) return '';
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const langLabel = lang ? `<span class="code-lang">${lang}</span>` : '';
    const copyBtn = `<button class="copy-btn" onclick="copyCode(this)">复制</button>`;
    return `<div class="code-block">${langLabel}${copyBtn}<pre><code>${code.trimEnd()}</code></pre></div>`;
  });
  html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^---+$/gm, '<hr>');
  html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  html = html.replace(/^\d+\. (.+)$/gm, '<oli>$1</oli>');
  html = html.replace(/(<oli>.*<\/oli>\n?)+/g, m => `<ol>${m.replace(/<\/?oli>/g, t => t.replace('oli','li'))}</ol>`);
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>(<(?:ul|ol|h[1-3]|hr|div|blockquote)[^>]*>)/g, '$1');
  html = html.replace(/(<\/(?:ul|ol|h[1-3]|hr|div|blockquote)>)<\/p>/g, '$1');
  html = html.replace(/<p><\/p>/g, '');
  return html;
}

function copyCode(btn) {
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

// ===== UI =====
function appendMessage(role, content, streaming) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  const s = getSettings();
  if (role === 'claude') {
    if (s.avatarUrl) {
      avatar.innerHTML = `<img src="${s.avatarUrl}" alt="">`;
    } else {
      avatar.textContent = s.name[0].toUpperCase();
    }
  } else {
    avatar.textContent = '我';
  }

  const contentWrap = document.createElement('div');
  contentWrap.className = 'msg-content';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (streaming) {
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  } else if (role === 'claude') {
    bubble.classList.add('markdown');
    bubble.innerHTML = renderMarkdown(content);
  } else {
    bubble.textContent = content;
  }

  contentWrap.appendChild(bubble);
  div.appendChild(avatar);
  div.appendChild(contentWrap);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

async function sendMessage() {
  if (isStreaming) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '';

  chatHistory.push({ role: 'user', content: text });
  appendMessage('user', text, false);

  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  const bubble = appendMessage('claude', '', true);
  let fullReply = '';

  try {
    await callGateway((chunk) => {
      if (fullReply === '') bubble.textContent = '';
      fullReply += chunk;
      bubble.textContent = fullReply;
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });
    bubble.classList.add('markdown');
    bubble.innerHTML = renderMarkdown(fullReply);
    chatHistory.push({ role: 'assistant', content: fullReply });
  } catch (e) {
    bubble.textContent = `[错误] ${e.message}`;
    chatHistory.pop();
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

function clearChat() {
  if (!confirm('清空对话记录？')) return;
  chatHistory = [];
  document.getElementById('messages').innerHTML = '';
}

// ===== INPUT =====
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ===== TOAST =====
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
applyProfile();
</script>
</body>
</html>
